# ============================================================
# Docker Compose — Movie Preference Analyzer
#
# Modes:
#   1. Standalone (default): Runs all queries in a single container
#   2. Cluster: Spark master + workers + submit job
#
# Usage:
#   docker compose up standalone        # Single container, all queries
#   docker compose up standalone-q1     # Single query
#   docker compose up cluster           # Full Spark cluster mode
# ============================================================

services:
  # --- Standalone mode: single container, all queries ---
  standalone:
    build: .
    container_name: movie-analyzer
    volumes:
      - ./data/ml-latest:/data/ml-latest:ro
      - ./output:/output
    environment:
      - SPARK_DRIVER_MEMORY=4g
    profiles: ["standalone"]

  # --- Run a single specific query ---
  standalone-q1:
    build: .
    container_name: movie-analyzer-q1
    command: ["--profile", "docker", "--query", "1"]
    volumes:
      - ./data/ml-latest:/data/ml-latest:ro
      - ./output:/output
    profiles: ["query"]

  # --- Cluster mode: master + workers ---
  spark-master:
    image: spark:3.5.4
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    profiles: ["cluster"]

  spark-worker-1:
    image: spark:3.5.4
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    profiles: ["cluster"]

  spark-worker-2:
    image: spark:3.5.4
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    profiles: ["cluster"]

  # Submit job to cluster
  spark-submit:
    build: .
    container_name: movie-analyzer-submit
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --class
      - movieanalyzer.Main
      - --master
      - spark://spark-master:7077
      - --driver-memory
      - 4g
      - --executor-memory
      - 2g
      - /app/movie-preference-analyzer.jar
    command: ["--profile", "docker", "--query", "all"]
    volumes:
      - ./data/ml-latest:/data/ml-latest:ro
      - ./output:/output
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    profiles: ["cluster"]
