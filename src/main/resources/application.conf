# Default configuration for Movie Preference Analyzer
# Override with local.conf or cluster.conf via --profile flag

app {
  spark {
    master = "local[*]"
    app-name = "MoviePreferenceAnalyzer"
  }

  paths {
    data-dir = "/data/ml-latest"
    output-dir = "/output"
  }

  # Query-specific parameters
  queries {
    # Q1: Iceberg — Top Tags by Genre with High Ratings
    iceberg {
      min-movies = 100
      min-avg-rating = 4.0
    }

    # Q3: Iceberg — Popular and Relevant Tags
    popular-tags {
      min-relevance = 0.6
      min-movies = 100
      min-avg-relevance = 0.8
    }

    # Q5: Multi-Iceberg Skyline
    skyline {
      min-movies = 200
    }

    # Q8: Reverse Nearest Neighbor
    reverse-nn {
      target-movie-id = 79132
      liked-threshold = 4.0
    }

    # Q9: Tag-Relevance Anomaly
    anomaly {
      tags = ["action", "classic", "thriller"]
      min-relevance = 0.8
      max-rating = 2.5
    }

    # Q10: Top-K Neighborhood
    top-k = 10
  }
}
